<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PsychoTest — Pertanyaan Bagian 2</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="assessment-2">

  <!-- Particles -->
  <div class="particles-container" aria-hidden="true"></div>

  <div class="page-wrapper" style="justify-content:flex-start;padding-top:2rem">

    <!-- Header -->
    <header style="width:100%;max-width:760px;margin-bottom:1.5rem" class="animate__animated animate__fadeInDown">
      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem">
        <a href="game.html"
           style="color:var(--text-secondary);font-size:1.3rem;text-decoration:none;transition:color 0.2s"
           aria-label="Kembali ke mini-game">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div>
          <div style="font-size:0.8rem;color:var(--text-secondary);font-weight:600;letter-spacing:0.05em">
            BAGIAN 2 / 2
          </div>
          <h2 class="section-title" style="margin:0;font-size:1.4rem;text-align:left">
            <i class="fas fa-clipboard-check" style="margin-right:0.5rem;color:var(--neon-green)"></i>
            Pertanyaan Terakhir
          </h2>
        </div>
      </div>

      <!-- Progress -->
      <div class="progress-container">
        <div class="progress-label">
          <span style="font-weight:700">
            <i class="fas fa-chart-line" style="margin-right:0.3rem;color:var(--neon-green)"></i>Kemajuan
          </span>
          <span id="progress-label">0 / 4 dijawab</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
        </div>
      </div>

      <!-- Step indicators -->
      <div class="step-indicators">
        <div class="step-dot done"   title="Mulai"></div>
        <div class="step-line"></div>
        <div class="step-dot done"   title="Kuesioner 1"></div>
        <div class="step-line"></div>
        <div class="step-dot done"   title="Mini-Game"></div>
        <div class="step-line"></div>
        <div class="step-dot active" title="Kuesioner 2"></div>
        <div class="step-line"></div>
        <div class="step-dot"        title="Hasil"></div>
      </div>
    </header>

    <!-- Motivational banner -->
    <div style="width:100%;max-width:760px;margin-bottom:1rem" class="animate__animated animate__fadeIn">
      <div style="
          background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(59,130,246,0.1));
          border: 1px solid rgba(16,185,129,0.3);
          border-radius: 14px;
          padding: 0.9rem 1.2rem;
          display: flex;
          align-items: center;
          gap: 0.8rem;
          font-size: 0.9rem;
          color: var(--neon-green-light);
      ">
        <i class="fas fa-trophy" style="font-size:1.4rem;flex-shrink:0"></i>
        <span>
          <strong>Hampir selesai!</strong> Ini adalah babak terakhir sebelum kamu mengetahui tipe kepribadianmu. 🎉
        </span>
      </div>
    </div>

    <!-- Questions Container (filled by JS) -->
    <div id="questions-container" style="width:100%;max-width:760px"></div>

    <!-- Navigation -->
    <div style="width:100%;max-width:760px;display:flex;justify-content:flex-end;margin-top:1.5rem;margin-bottom:2rem"
         class="animate__animated animate__fadeInUp">
      <button id="next-btn" class="btn btn-primary" style="font-size:1.05rem">
        Lihat Hasil
        <i class="fas fa-chart-bar"></i>
      </button>
    </div>

  </div>

  <script src="js/main.js"></script>
</body>
</html>
